name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to verify and package
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  build-and-test:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: aarch64
          - os: macos-26
            target: aarch64-apple-darwin
            architecture: arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            architecture: x86_64

    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify installer
        run: |
          sh -n install.sh
          sh -n launcher.sh
          ./install.sh --help >/dev/null

      - name: Build
        run: make --jobs 3 all

      - name: Test
        run: make test

      - name: Package release artifact
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          archive="microcodex-${TARGET}.tar.gz"
          binary="microcodex-${TARGET}"
          mkdir -p dist
          cp build/microcodex "dist/${binary}"
          chmod 755 "dist/${binary}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${binary}" > "${binary}.sha256")
          else
            (cd dist && shasum -a 256 "${binary}" > "${binary}.sha256")
          fi
          tar -C dist -czf "dist/${archive}" "${binary}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          else
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/microcodex-${{ matrix.target }}.tar.gz
            dist/microcodex-${{ matrix.target }}.tar.gz.sha256
            dist/microcodex-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

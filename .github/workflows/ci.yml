# Format check, clang-tidy lint, script lint, and warning-free builds and tests
# on Linux and macOS. Runs on every push and pull request; the release
# workflow also calls it, so release artifacts are only published when CI
# passes on the released commit.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to verify and package
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18

      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-18

  lint:
    name: Lint (clang-tidy, -Werror)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      # clang-tidy 18 cannot parse libstdc++'s <expected>, so lint with 19.
      - name: Install lint tools and headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy-19 libcurl4-openssl-dev libssl-dev

      - name: Lint with clang-tidy
        run: make --jobs 4 lint CLANG_TIDY=clang-tidy-19

  scripts:
    name: Lint scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck install.sh launcher.sh tests/*.sh

      # ruby -wc exits successfully even when it prints warnings.
      - name: Check Ruby test fixtures
        run: |
          status=0
          for fixture in tests/*.rb; do
            output=$(ruby -wc "$fixture" 2>&1) || status=1
            if [ "$output" != "Syntax OK" ]; then
              printf '%s: %s\n' "$fixture" "$output"
              status=1
            fi
          done
          exit "$status"

  linux-build-and-test:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: debian:12
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: aarch64

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            libcurl4-openssl-dev \
            libssl-dev \
            ruby

      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify build baseline and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$(. /etc/os-release && printf '%s' "$VERSION_ID")" = "12"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"

      - name: Verify installer
        run: |
          sh -n install.sh
          sh -n launcher.sh
          ./install.sh --help >/dev/null

      - name: Build
        run: make --jobs 3 all WERROR=1

      - name: Test
        run: make test

      - name: Verify Linux ABI baseline
        shell: bash
        run: |
          set -euo pipefail
          highest_glibc="$(readelf --version-info build/microcodex | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)"
          highest_glibcxx="$(readelf --version-info build/microcodex | grep -oE 'GLIBCXX_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)"
          printf 'Highest required glibc symbol: %s\n' "${highest_glibc:-none}"
          printf 'Highest required libstdc++ symbol: %s\n' "${highest_glibcxx:-none}"
          test "$(printf '%s\n' GLIBC_2.36 "$highest_glibc" | sort -V | tail -n 1)" = "GLIBC_2.36"
          test "$(printf '%s\n' GLIBCXX_3.4.30 "$highest_glibcxx" | sort -V | tail -n 1)" = "GLIBCXX_3.4.30"
          build/microcodex --help >/dev/null

      - name: Package release artifact
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          archive="microcodex-${TARGET}.tar.gz"
          binary="microcodex-${TARGET}"
          mkdir -p dist
          cp build/microcodex "dist/${binary}"
          chmod 755 "dist/${binary}"
          (cd dist && sha256sum "${binary}" > "${binary}.sha256")
          tar -C dist -czf "dist/${archive}" "${binary}"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/microcodex-${{ matrix.target }}.tar.gz
            dist/microcodex-${{ matrix.target }}.tar.gz.sha256
            dist/microcodex-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Fails when the executable or a session's peak memory goes over the budgets
  # at the top of tests/footprint.sh, or, on a pull request, grows too much
  # over the base branch. It measures the x86_64 release build environment. The
  # report goes to the run summary, and footprint-comment.yml posts it on the
  # pull request.
  footprint:
    name: Footprint (size and memory budgets)
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            libcurl4-openssl-dev \
            libssl-dev \
            ruby

      # The full history is needed to build the pull request's base commit.
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # The container runs as root, but the checkout belongs to the runner
      # user, and git refuses worktree commands in a repository owned by
      # someone else.
      - name: Allow git to use the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check footprint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make --jobs 3 footprint FOOTPRINT_BASE="$BASE_SHA" FOOTPRINT_REPORT=build/footprint.md

      - name: Add the report to the run summary
        if: always() && hashFiles('build/footprint.md') != ''
        run: cat build/footprint.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pull request number for the comment
        if: always() && github.event_name == 'pull_request' && hashFiles('build/footprint.md') != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PR_NUMBER" > build/footprint-pr

      - name: Upload the report
        if: always() && github.event_name == 'pull_request' && hashFiles('build/footprint.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: footprint-report
          path: |
            build/footprint.md
            build/footprint-pr
          if-no-files-found: error
          retention-days: 7

  macos-build-and-test:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            architecture: arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            architecture: x86_64

    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify installer
        run: |
          sh -n install.sh
          sh -n launcher.sh
          ./install.sh --help >/dev/null

      - name: Build
        run: make --jobs 3 all WERROR=1

      - name: Test
        run: make test

      - name: Package release artifact
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          archive="microcodex-${TARGET}.tar.gz"
          binary="microcodex-${TARGET}"
          mkdir -p dist
          cp build/microcodex "dist/${binary}"
          chmod 755 "dist/${binary}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${binary}" > "${binary}.sha256")
          else
            (cd dist && shasum -a 256 "${binary}" > "${binary}.sha256")
          fi
          tar -C dist -czf "dist/${archive}" "${binary}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          else
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/microcodex-${{ matrix.target }}.tar.gz
            dist/microcodex-${{ matrix.target }}.tar.gz.sha256
            dist/microcodex-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7
